{% extends 'base.html' %}
{% block titulo %}{{ 'Editar Função' if dados else 'Nova Função' }} — VitaSaúde{% endblock %}

{% block conteudo %}
<div class="page-header">
    <h2>🛠️ {{ 'Editar Função' if dados else 'Nova Função' }}</h2>
</div>

<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="card">
            <div class="card-header" style="background:var(--azul-escuro);color:#fff;">
                Dados da função
            </div>
            <div class="card-body p-4">
                
                {% if dados %}
                    <form action="{{ url_for('editar_funcao', id=dados.id) }}" method="POST">
                {% else %}
                    <form action="{{ url_for('inserir_funcao') }}" method="POST">
                {% endif %}

                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome da Função <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="nome" name="nome"
                               value="{{ dados.nome if dados else '' }}" required minlength="2" placeholder="Ex: Enfermeiro(a)">
                    </div>

                    <div class="mb-3">
                        <label for="descricao" class="form-label">Descrição</label>
                        <textarea class="form-control" id="descricao" name="descricao" rows="3">{{ dados.descricao if dados else '' }}</textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Permissões e Status</label>
                        <div class="card p-3 border-light shadow-sm">
                            <div class="form-check form-switch mb-2">
                                <input class="form-check-input" type="checkbox" id="status" name="status" 
                                       {% if not dados or dados.status %}checked{% endif %}>
                                <label class="form-check-label" for="status">Função Ativa</label>
                            </div>
                            
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="pode_gerenciar" name="pode_gerenciar"
                                       {% if dados and dados.pode_gerenciar_usuarios %}checked{% endif %}>
                                <label class="form-check-label" for="pode_gerenciar">
                                    Pode gerenciar outros usuários? (Admin)
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary px-4">
                            {{ '💾 Salvar Alterações' if dados else '✅ Cadastrar Função' }}
                        </button>
                        <a href="{{ url_for('listar_funcoes') }}" class="btn btn-outline-secondary">❌ Cancelar</a>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
