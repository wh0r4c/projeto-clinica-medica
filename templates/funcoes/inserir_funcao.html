{% extends 'base.html' %}
{% block titulo %}{{ 'Editar Função' if dados else 'Nova Função' }} — VitaSaúde{% endblock %}

{% block conteudo %}
<div class="page-header">
    <h2>🛠️ {{ 'Editar Função' if dados else 'Nova Função' }}</h2>
</div>

<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="card">
            <div class="card-header" style="background:var(--azul-escuro);color:#fff;">
                Dados da função
            </div>
            <div class="card-body p-4">
                
                {% if dados %}
                    <form action="{{ url_for('editar_funcao', id=dados.id_funcao) }}" method="POST">
                {% else %}
                    <form action="{{ url_for('inserir_funcao') }}" method="POST">
                {% endif %}

                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome da Função <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="nome" name="nome"
                               value="{{ dados.nome if dados else '' }}" required minlength="2" placeholder="Ex: Enfermeiro(a)">
                    </div>

                    <div class="mb-3">
                        <label for="descricao" class="form-label">Descrição</label>
                        <textarea class="form-control" id="descricao" name="descricao" rows="3">{{ dados.descricao if dados else '' }}</textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Permissões de Acesso do Sistema</label>
                        <div class="card p-3 border-light shadow-sm">
                            
                            <div class="form-check form-switch mb-3 pb-2" style="border-bottom: 1px solid #eee;">
                                <input class="form-check-input" type="checkbox" id="status" name="status" 
                                {{ 'checked' if (dados and dados.status == 'Ativo') or not dados else '' }}>
                                <label class="form-check-label" for="status"><strong>Função Ativa</strong></label>
                            </div>
                            
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" id="pode_gerenciar_usuarios" name="pode_gerenciar_usuarios" value="1"
                                {{ 'checked' if dados and dados.pode_gerenciar_usuarios else '' }}>
                                <label class="form-check-label" for="pode_gerenciar_usuarios">Pode gerenciar <b>Usuários</b></label>
                            </div>
                            
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" id="pode_gerenciar_pacientes" name="pode_gerenciar_pacientes" value="1"
                                {{ 'checked' if dados and dados.pode_gerenciar_pacientes else '' }}>
                                <label class="form-check-label" for="pode_gerenciar_pacientes">Pode gerenciar <b>Pacientes</b></label>
                            </div>

                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" id="pode_gerenciar_especialidades" name="pode_gerenciar_especialidades" value="1"
                                {{ 'checked' if dados and dados.pode_gerenciar_especialidades else '' }}>
                                <label class="form-check-label" for="pode_gerenciar_especialidades">Pode gerenciar <b>Especialidades</b></label>
                            </div>

                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="pode_gerenciar_consultas" name="pode_gerenciar_consultas" value="1"
                                {{ 'checked' if dados and dados.pode_gerenciar_consultas else '' }}>
                                <label class="form-check-label" for="pode_gerenciar_consultas">Pode gerenciar <b>Consultas</b></label>
                            </div>

                        </div>
                    </div>

                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary px-4">
                            {{ '💾 Salvar Alterações' if dados else '✅ Cadastrar Função' }}
                        </button>
                        <a href="{{ url_for('listar_funcoes') }}" class="btn btn-outline-secondary">❌ Cancelar</a>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
